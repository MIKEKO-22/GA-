<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b1020"><link rel="manifest" href="manifest.webmanifest"><title>GA BATTLE SUPPORT · DUEL</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#080d18;color:#eef3ff}*{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden}button,input{font:inherit}button{color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:active{filter:brightness(1.35)}.app{height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) 104px minmax(0,1fr);gap:7px;padding:7px;overflow:hidden}.player{border-radius:18px;border:2px solid;display:flex;flex-direction:column;justify-content:center;align-items:stretch;min-width:0;min-height:0;padding:clamp(7px,1.6vw,18px);gap:clamp(4px,1.5vh,12px);text-align:center}.red{background:linear-gradient(135deg,#391b2b,#170f20);border-color:#e45c70}.blue{background:linear-gradient(135deg,#122d48,#101b30);border-color:#59aaff}.player.red .inside{transform:none}.inside{width:100%;height:100%;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:clamp(4px,1.5vh,12px);min-height:0}.name{font-size:clamp(14px,2.4vw,25px);font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sectionlabel{font-size:clamp(10px,1.2vw,15px);font-weight:700;letter-spacing:.12em;opacity:.75}.vpnum{font-size:clamp(52px,15vh,132px);font-weight:900;line-height:.95;font-variant-numeric:tabular-nums}.points{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.points button{border:1px solid #ffffff55;background:#ffffff18;border-radius:12px;min-height:clamp(42px,10vh,78px);font-size:clamp(17px,2.6vw,29px);font-weight:800}.clockbtn{background:#0006;border:2px solid #ffffff66;border-radius:18px;width:100%;padding:8px 3px;min-height:0;flex:0 1 auto}.clocknum{display:block;font-size:clamp(42px,9vw,108px);font-weight:900;letter-spacing:-.06em;line-height:1.08;font-variant-numeric:tabular-nums}.clockstatus{display:block;font-size:clamp(10px,1.4vw,16px);font-weight:750;margin-top:3px}.clockbtn.active{border-color:#ffe58d;box-shadow:0 0 0 3px #ffe58d55;background:#4c3b1759}.clockbtn.expired{background:#9d223a88}.middle{display:flex;flex-direction:column;gap:7px;align-items:stretch;justify-content:center;min-width:0}.brand{text-align:center;font-weight:900;font-size:12px;line-height:1.3}.brand span{display:block;color:#9baecb;font-size:10px}.middle button{border:1px solid #526381;background:#243450;border-radius:11px;padding:9px 3px;font-size:12px;min-height:43px;font-weight:750}.middle button.selected{background:#c09236;color:#111722;border-color:#f0c65f}.middle button.danger{background:#58303a}.tiny{text-align:center;font-size:10px;color:#afbed6}.hidden{display:none!important}.overlay{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:15px;z-index:10}.dialog{width:min(520px,95vw);max-height:94dvh;overflow:auto;background:#18243b;border:1px solid #667a99;border-radius:18px;padding:20px;box-shadow:0 12px 50px #0009}.dialog h2{margin:0 0 14px}.formrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}.formrow input{min-width:0;width:55%;padding:10px;background:#0c1629;color:white;border:1px solid #687c99;border-radius:9px}.dialog button{padding:10px 14px;border:1px solid #7184a2;background:#334768;border-radius:9px}.dialog .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.hint{font-size:12px;color:#b6c6dc;line-height:1.5}.mode-vp .clockwrap,.mode-clock .vpwrap{display:none}.mode-vp .vpnum{font-size:clamp(85px,26vh,220px)}.mode-vp .points button{min-height:clamp(55px,16vh,120px);font-size:clamp(22px,4vw,44px)}.mode-clock .clocknum{font-size:clamp(55px,12vw,145px)}.mode-clock .clockbtn{padding:clamp(16px,7vh,70px) 4px}.mode-both .vpnum{font-size:clamp(42px,12vh,100px)}.mode-both .clocknum{font-size:clamp(38px,7.5vw,80px)}.mode-both .points button{min-height:clamp(37px,8vh,67px)}.mode-both .clockbtn{padding:6px 2px}.landscapeNote{display:none}@media(orientation:portrait){.app{grid-template-columns:1fr;grid-template-rows:1fr 75px 1fr}.middle{flex-direction:row;align-items:center}.middle button{flex:1}.brand,.tiny{display:none}.landscapeNote{display:block;position:fixed;z-index:5;bottom:3px;left:50%;transform:translateX(-50%);background:#d9a94b;color:#171b24;padding:2px 8px;border-radius:8px;font-size:10px;pointer-events:none}.mode-vp .vpnum{font-size:clamp(48px,13vh,90px)}.mode-clock .clocknum{font-size:clamp(40px,12vw,90px)}.player.red .inside{transform:none}}@media(orientation:landscape) and (max-height:350px){.app{grid-template-columns:minmax(0,1fr) 84px minmax(0,1fr);gap:4px;padding:4px}.player{padding:5px;gap:3px}.inside{gap:3px}.middle{gap:3px}.middle button{min-height:29px;padding:3px;font-size:10px}.brand{font-size:10px}.points button{min-height:32px}.mode-both .vpnum{font-size:clamp(30px,11vh,60px)}.mode-both .clocknum{font-size:clamp(28px,7vw,52px)}.sectionlabel{font-size:10px}}

</style></head><body><div id="app" class="app mode-both"><section class="player red"><div class="inside" id="red"></div></section><nav class="middle"><div class="brand">GA<br>BATTLE<br>SUPPORT<span>DUEL</span></div><button data-mode="vp">VPのみ</button><button data-mode="clock">時計のみ</button><button data-mode="both">両方</button><button id="pause">一時停止</button><button id="undo">VPを戻す</button><button id="settings">⚙ 設定</button><div class="tiny">非公式<br>ファンツール</div></nav><section class="player blue"><div class="inside" id="blue"></div></section></div><div class="landscapeNote">横画面での利用をおすすめします</div><div id="modal" class="overlay hidden"><div class="dialog"><h2>対戦設定</h2><label class="formrow">赤プレイヤー名<input id="redName" maxlength="20"></label><label class="formrow">青プレイヤー名<input id="blueName" maxlength="20"></label><label class="formrow">持ち時間（分）<input id="minutes" type="number" min="1" max="999" step="1"></label><label class="formrow">交代時の加算（秒）<input id="increment" type="number" min="0" max="600" step="1"></label><label class="formrow">時計終了音<input id="sound" type="checkbox" style="width:auto"></label><p class="hint">赤・青とも同じ向きに表示します。時計をタップすると、そのプレイヤーの時計を開始します。計時中のプレイヤーが自分の時計をタップすると相手に交代します。VP・時計はそれぞれ独立してリセットできます。端末内に自動保存します。</p><div class="actions" style="flex-wrap:wrap"><button id="resetVP">VPリセット</button><button id="resetClock">時計リセット</button><button id="resetAll">全初期化</button></div><div class="actions"><button id="close">閉じる</button><button id="apply">設定を保存</button></div></div></div><script>
(()=>{'use strict';const KEY='ga-battle-support-duel-v1',OLD='ga-battle-support-v1';const $=id=>document.getElementById(id);const base=()=>({mode:'both',names:{red:'RED TEAM',blue:'BLUE TEAM'},vp:{red:0,blue:0},clock:{initial:1800000,increment:0,remaining:{red:1800000,blue:1800000},active:null,startedAt:null,pausedTeam:null},sound:false});let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch{}if(!s){s=base();try{const old=JSON.parse(localStorage.getItem(OLD)||'null');if(old){if(old.names)s.names=old.names;if(old.vp)s.vp=old.vp;if(old.clock){s.clock={...s.clock,...old.clock,active:null,startedAt:null,pausedTeam:null}}if(typeof old.sound==='boolean')s.sound=old.sound}}catch{}}s={...base(),...s};s.clock={...base().clock,...s.clock};s.clock.remaining={...base().clock.remaining,...s.clock.remaining};s.clock.active=null;s.clock.startedAt=null;s.clock.pausedTeam=null;let history=[];const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}};const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const other=t=>t==='red'?'blue':'red';const fmt=ms=>{let n=Math.max(0,Math.ceil(ms/1000));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`};function beep(){if(!s.sound)return;try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=760;g.gain.value=.08;o.start();o.stop(a.currentTime+.22);o.onended=()=>a.close()}catch{}}function sync(){let c=s.clock;if(c.active&&c.startedAt){let t=c.active,elapsed=Math.max(0,Date.now()-c.startedAt);c.remaining[t]=Math.max(0,c.remaining[t]-elapsed);c.startedAt=Date.now();if(c.remaining[t]===0){c.active=null;c.startedAt=null;c.pausedTeam=null;beep();save()}}}function draw(){const app=$('app');app.className='app mode-'+s.mode;document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('selected',b.dataset.mode===s.mode)});for(const t of ['red','blue']){let c=s.clock,active=c.active===t,paused=c.pausedTeam===t;$(t).innerHTML=`<div class="name">${esc(s.names[t])}</div><div class="vpwrap"><div class="sectionlabel">VICTORY POINTS</div><div class="vpnum">${s.vp[t]}</div><div class="points"><button data-vp="${t}" data-add="-1">−1</button><button data-vp="${t}" data-add="1">+1</button><button data-vp="${t}" data-add="2">+2</button><button data-vp="${t}" data-add="5">+5</button></div></div><div class="clockwrap"><div class="sectionlabel">TIME CLOCK</div><button class="clockbtn ${active?'active':''} ${c.remaining[t]===0?'expired':''}" data-clock="${t}"><span class="clocknum" id="time-${t}">${fmt(c.remaining[t])}</span><span class="clockstatus">${active?'● 計時中 · タップで交代':paused?'一時停止中':c.active?'タップで自分に交代':'タップして開始'}</span></button></div>`}document.querySelectorAll('[data-vp]').forEach(b=>b.onclick=()=>{history.push({...s.vp});if(history.length>30)history.shift();let t=b.dataset.vp;s.vp[t]=Math.max(0,(Number(s.vp[t])||0)+Number(b.dataset.add));save();draw()});document.querySelectorAll('[data-clock]').forEach(b=>b.onclick=()=>{sync();let t=b.dataset.clock,c=s.clock;if(c.active===t){if(c.remaining[other(t)]<=0)return;c.remaining[t]+=c.increment*1000;c.active=other(t)}else if(c.active){if(c.remaining[t]<=0)return;c.remaining[c.active]+=c.increment*1000;c.active=t}else{if(c.remaining[t]<=0)return;c.active=t}c.startedAt=Date.now();c.pausedTeam=null;save();draw()});$('pause').textContent=s.clock.active?'⏸ 停止':s.clock.pausedTeam?'▶ 再開':'⏸ 停止'}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{sync();s.mode=b.dataset.mode;save();draw()});$('pause').onclick=()=>{sync();let c=s.clock;if(c.active){c.pausedTeam=c.active;c.active=null;c.startedAt=null}else if(c.pausedTeam&&c.remaining[c.pausedTeam]>0){c.active=c.pausedTeam;c.pausedTeam=null;c.startedAt=Date.now()}else{alert('時計をタップして開始してください');return}save();draw()};$('undo').onclick=()=>{if(!history.length){alert('戻せるVP操作がありません');return}s.vp=history.pop();save();draw()};$('settings').onclick=()=>{sync();$('redName').value=s.names.red;$('blueName').value=s.names.blue;$('minutes').value=s.clock.initial/60000;$('increment').value=s.clock.increment;$('sound').checked=s.sound;$('modal').classList.remove('hidden')};$('close').onclick=()=>$('modal').classList.add('hidden');$('apply').onclick=()=>{let m=Number($('minutes').value),inc=Number($('increment').value);if(!Number.isInteger(m)||m<1||m>999||!Number.isInteger(inc)||inc<0||inc>600){alert('持ち時間は1〜999分、加算秒数は0〜600秒で入力してください');return}if(m*60000!==s.clock.initial&&!confirm('持ち時間を変更すると時計が初期化されます。よろしいですか？'))return;s.names.red=$('redName').value.trim()||'RED TEAM';s.names.blue=$('blueName').value.trim()||'BLUE TEAM';s.sound=$('sound').checked;s.clock.increment=inc;if(m*60000!==s.clock.initial){s.clock.initial=m*60000;s.clock.remaining={red:m*60000,blue:m*60000};s.clock.active=null;s.clock.startedAt=null;s.clock.pausedTeam=null}save();$('modal').classList.add('hidden');draw()};$('resetVP').onclick=()=>{if(!confirm('両プレイヤーのVPを0にしますか？'))return;history.push({...s.vp});s.vp={red:0,blue:0};save();draw()};$('resetClock').onclick=()=>{if(!confirm('両プレイヤーの時計を初期化しますか？'))return;let c=s.clock;c.remaining={red:c.initial,blue:c.initial};c.active=null;c.startedAt=null;c.pausedTeam=null;save();draw()};$('resetAll').onclick=()=>{if(!confirm('すべての対戦データと設定を初期化しますか？'))return;s=base();history=[];save();$('modal').classList.add('hidden');draw()};document.addEventListener('visibilitychange',()=>{if(document.hidden){sync();save()}else{sync();draw()}});setInterval(()=>{if(s.clock.active){sync();for(const t of ['red','blue']){const el=$('time-'+t);if(el)el.textContent=fmt(s.clock.remaining[t])}if(!s.clock.active)draw();save()}},250);save();draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script></body></html>
